name: Build Ionic Angular APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches:
      - '**'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21 for x64
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: x64

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install Ionic
        run: npm install -g @ionic/cli

      - name: Install app dependencies
        run: npm install
        working-directory: ./adventskalender-app

      - name: Build Ionic App
        run: ionic build
        working-directory: ./adventskalender-app

      - name: ionic add android
        run: ionic cap add android
        working-directory: ./adventskalender-app

      - name: Build Android Dev APK
        run: ionic capacitor build android
        working-directory: ./adventskalender-app

      - name: Generate the Android App Bundle for debug
        working-directory: ./adventskalender-app/android/
        run: ./gradlew assembleDebug

      - name: Save bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: |
            ${{ github.workspace }}/adventskalender-app/android/app/build/outputs/apk/debug/*.apk